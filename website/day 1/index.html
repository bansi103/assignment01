<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .second-header .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(168, 135, 135);
            padding: 5px 80px;
            color: white;
        }

        .second-header .header .info {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .second-header .header .info ul {
            display: flex;
            align-items: center;
            gap: 30px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .second-header .header .info ul li {
            text-transform: capitalize;
        }

        .second-header .header .info .btn button {
            padding: 15px 18px;
            text-transform: capitalize;
            border-radius: 5px;
            border: none;

        }

        .img {
            background-image: url(https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8cmVzdGF1cmFudHxlbnwwfHwwfHx8MA%3D%3D);
        }
    </style>
</head>

<body>
    <div class="second-header">
        <div class="header">
            <div class="logo">
                <h1>Feliciano</h1>
            </div>

            <div class="info">
                <div>
                    <ul>
                        <li>home</li>
                        <li>about</li>
                        <li>menu</li>
                        <li>story</li>
                        <li>contact</li>
                    </ul>
                </div>
                <div class="btn">
                    <button>book a tabel</button>

                </div>
            </div>

        </div>
    </div>
    <section class="img">

    </section>
</body>

</html>
