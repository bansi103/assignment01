<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
        }



        .main {
            height: 720px;
            width: 100%;
            background: linear-gradient(45deg, orange, yellow);
            display: flex;
        }



        img {
            height: 300px;
            width: 400px;
            object-fit: cover;


        }

        .form {
            height: 300px;
            width: 300px;
            background-color: blue;
            color: white;
            margin-bottom: 4px;
        }


        .hello {
            margin-left: 10px;
            margin-top: 5px;

        }

        h1 {
            margin-top: 20px;
            margin-left: 10px;

        }

        .id,
        .pass {
            display: flex;
            justify-content: space-between;
            margin-right: 10px;
            margin-left: 10px;
            margin-bottom: 15px;
            padding-top: 5px;

        }


        hr {
            margin: 10px;
        }

        .child {
            display: flex;
            justify-content: space-between;
            margin-right: 10px;
            margin-left: 10px;
            margin-bottom: 15px;
            padding-top: 5px;


        }

        button {
            padding: 4px;
        }

        .f1 {
            margin: 5px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="container">
            <div class="lap_img">
                <img src="https://images.pexels.com/photos/7610461/pexels-photo-7610461.jpeg" alt="">

            </div>
            <div class="form">
                <h1>login</h1>
                <p class="hello">Hello lets go started</p><br>
                <div class="id">
                    <p>Email id </p>
                    <i class="fa-solid fa-user"></i>
                </div>
                <hr>
                <div class="pass">
                    <p> password </p>
                    <i class="fa-solid fa-key"></i>
                </div>
                <hr>
                <div class="child">
                    <p class="f1">forgot password? Click here</p>
                    <button>Continue <i class="fa-solid fa-right-long"></i></button>
                </div>


            </div>

        </div>
    </div>
</body>

</html>
