<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            display: grid;
            grid-template-columns: auto auto auto auto;
            justify-items: center;
            background-color: rgb(205, 230, 222);
        }


        .box1,
        .box2,
        .box7,
        .box4 {
            height: 100px;
            width: 200px;
            border: 2px solid green;

        }

        .box3,
        .box6,
        .box5,
        .box8 {
            height: 200px;
            width: 200px;
            border: 2px solid green;

        }

        img {
            width: 100%;
            height: 100%
        }

        .box7,
        .box5 {
            transform: rotate(378deg);
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box1">
            <img src="./assest/1_tiger.webp" alt="">
        </div>
        <div class="box2">
            <img src="./assest/2_Giraffe.avif" alt="">
        </div>
        <div class="box3">
            <img src="./assest/3_dogs.avif" alt="">
        </div>
        <div class="box4">
            <img src="./assest/4_Panda.jpg" alt="">
        </div>
        <div class="box5"><img src="./assest/5_baby-animal.avif" alt=""></div>
        <div class="box6"><img src="./assest/6_images.jpg" alt=""></div>
        <div class="box7"><img src="./assest/7_lion.jpg" alt=""></div>
        <div class="box8"><img src="./assest/8_African.webp" alt=""></div>

    </div>

</body>

</html>
