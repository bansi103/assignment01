<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            display: grid;
            grid-template-columns: auto auto auto;
            text-align: center;
            justify-content: center;
            padding: 50px;
            /* gap: 3px; */

        }

        img {
            max-width: 100%;
            vertical-align: middle;
            border: 1px solid black;
        }
        .img3{
            grid-row-start: 1;
            grid-row-end:span 2;
            grid-column: 3;
        
        }
        .img4{
            grid-row-start: 2;
            grid-row-end:span 2;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="img1">
            <img src="./assest/2_Giraffe.avif" height="100px" width="200px">
        </div>
        <div class="img2">
            <img src="./assest/1_tiger.webp" height="100px" width="200px" alt="">
        </div>
        <div class="img3">
            <img src="./assest/3_dogs.avif" height="200px" width="200px" alt="">
        </div>
        <div class="img4">
            <img src="./assest/8_African.webp" height="200px" width="200px" alt="">
        </div>
        <div class="img5">
            <img src="./assest/4_Panda.jpg" height="100px" width="200px" alt="">
        </div>
        <div class="img6">
            <img src="./assest/7_lion.jpg" height="100px" width="200px" alt="">
        </div>

    </div>
</body>

</html>
