<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .imagescale {
            width: 300px;
            height: 300px;
            margin: auto;
            border: 10px groove lightcoral;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        img {
            width: 400px;
            height: 400px;
            vertical-align: middle;
            transition: 1s ease-in-out;
        }

        .imagescale:hover img {
            scale: 0.9;
        }
    </style>
</head>

<body>
    <div class="imagescale">
        <img src="https://plus.unsplash.com/premium_photo-1664474619075-644dd191935f?fm=jpg&q=60&w=3000&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8aW1hZ2V8ZW58MHx8MHx8fDA%3D"
            alt="">
    </div>
</body>

</html>
