<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .main {
            height: 724px;
            width: 100%;
            background-image: linear-gradient(210deg, white, blue);

        }

        .box {
            position: relative;
        }

        .box1 {
            border: 1px solid black;
            box-shadow: 2px 2px 2px rgba(0, 0, 0, 0.9);
            text-align: center;
            padding: 20px 40px;
            background-color: white;
            position: absolute;
            top: 255px;
            left: 607px;

        }
        input{
            margin-bottom: 10px;
            border-radius: 5px;
            width: 200px;
            padding: 5px;
        }
        h1{
            margin-bottom: 3px;
            padding: 5px;
        }
        button{
            color: white;
            background-color: blue;
            border-radius: 6px;
            padding: 5px 15px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box">
            <div class="box1">
                <h1>Login</h1>
                <input type="email" placeholder="Enter Email"><br>
                <input type="password" placeholder="Enter password"><br>    
                <button>Submit > </button>
            </div>
        </div>



    </div>

</body>

</html>
