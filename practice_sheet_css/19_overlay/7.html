<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .img1 {
            width: 300px;
            margin: 100px auto;
            position: relative;
        }

        img {
            max-width: 100%;
            vertical-align: middle;

        }

        .div2 {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            color: white;
            display: grid;
            place-content: center;
            transition: 0.6s ease;
            transform: rotate(360deg);


        }

        .img1:hover .div2 {
            background-color: rgba(0, 0, 0, 0.591);
            transform: rotate(0deg);


        }

        .move {
            transform: rotate(360deg);
            transition: 0.6s ease ;
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            display: grid;
            place-content: center;
            color: aliceblue;
            
        }

        .img1:hover .move {
            transform: rotate(0deg);
            transition-delay: 0.6s;
        }
    </style>
</head>

<body>
    <div class="img1">
        <img src="../assest/4_Panda.jpg" alt="">

        <div class="div2">
           
            </div>
            <div class="move">
                <span>IMAGE OVERLAY</span>

        </div>
    </div>


</body>

</html>
