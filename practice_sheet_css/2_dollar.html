<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0%;
            margin: 0%;
            box-sizing: border-box;
        }

        .main {

            outline: 18px solid rgb(222, 219, 219);
            width: 250px;
            margin: 100px auto;
            border-bottom: 3px solid blue;
        }

        .dollar {
            padding-left: 30px;
            padding-top: 20px;
            margin: 1px;

        }

        .amount1 {
            color: rgb(192, 178, 178);
            font-size: 20px;
        }

        .amount2 {
            font-size: 25px;
        }

        p {
            padding-left: 30px;
            color: rgb(192, 178, 178);
        }

        img {

            margin-left: 40px;
            width: 150px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="dollar">
            <span class="amount1">$</span> <span class="amount2">1283</span>
        </div>
        <p>sales income</p>
        <br>
        <img src="./assest/img1.png" alt="" width="100px" height="100px">
    </div>
</body>

</html>
