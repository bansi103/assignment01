<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn {
            padding: 10px 15px;
            border: 1px solid blue;
            color: blue;
            transition: 0.6s ease;
            position: relative;
            z-index: 1;


        }

        .btn::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            top: 0;
            background-color: blue;
            z-index: -1;
            transform: scale(0);
            transition: transform 0.6s ease;
            transform-origin: top left;
            border-bottom-right-radius: 50%;


        }

        .btn:hover::after {
            transform: scale(1);


        }

        .btn:hover {

            color: white;

        }
    </style>
</head>

<body>
    <button class="btn">click here</button>

</body>

</html>
