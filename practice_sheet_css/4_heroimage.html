<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            margin: 0;
            padding: 0%;
            box-sizing: border-box;
        }

        img {
            width: 100%;
            height: 725px;
            object-fit: cover;
            filter: brightness(20%);

        }

        .hero_img {
            position: relative;
        }

        .img_text {
            position: absolute;
            top: 215px;
            left: 556px;
            color: white;
            text-align: center;

        }

        h1 {
            font-size: 44px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);

        }
        p{
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);  
            font-size: 20px;
        }

        .botton1 {

            position: absolute;
            top: 330px;
            left: 721px;
        }

        button {
            background-color: fuchsia;
            color: white;
            padding: 5px;
            border-radius: 5px;

        }
    </style>
</head>

<body>
    <div class="hero_img">
        <img src="https://images.pexels.com/photos/19115419/pexels-photo-19115419.jpeg?cs=srgb&dl=pexels-ericson-fernandes-855622-19115419.jpg&fm=jpg"
            alt="">
        <div class="img_text">
            <h1>Discover the world</h1><br>
            <p>We offer the best adventure holidays and tailor-made trips! </p>
        </div>
        <div class="botton1">
            <button>Search for fours <i class="fa-solid fa-arrow-right"></i></button>

        </div>

    </div>
</body>

</html>
