<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }


        .main {
            background-color: aquamarine;

            text-align: center;
            padding: 10px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: inline-block;
            margin-right: 10px ;
            
        }

        a {
            text-decoration: none;
            padding: 10px 20px;
            background-color: rgb(170, 211, 211);
            transition: background-color 1s ease;
            color: black;


        }

        a:hover {
            background-color: rgb(3, 22, 16);
            color: white;
        }
    </style>
</head>

<body>
    <div class="main">
        <ul>
            <li><a href="#" target="_blank">About</a></li>
            <li><a href="#" target="_blank">Home</a></li>
            <li><a href="#" target="_blank">service</a></li>
            <li><a href="#" target="_blank">service</a></li>
        </ul>

    </div>
</body>

</html>
