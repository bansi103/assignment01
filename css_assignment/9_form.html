<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        label {
            font-family: sans-serif;
            font-size: small;

        }

        .main {
            height: 500px;
            width: 500px;
            background-color: rgb(188, 232, 217);
            margin: 4px auto;
            padding-left: 15px;


        }

        h1 {
            text-align: center;
            padding-top: 10px;
        }

        #name {
            width: 45%;
            padding: 5px;
            margin: 7px;
            border: 1px solid white;
            border-radius: 7px;



        }

        #email,
        #number {
            width: 93.50%;
            padding: 5px;
            margin: 7px;
            border: 1px solid white;
            border-radius: 7px;



        }

        #message {
            width: 93.50%;
            padding: 5px;
            margin: 7px;
            border: 1px solid white;
            border-radius: 7px;



        }

        .button {
            margin: 5px 200px;
            padding: 7px 20px;
            border: 1px solid white;
            border-radius: 7px;
        }
    </style>
</head>

<body>
    <div class="main">
        <h1>Contact</h1>
        <label for="name">Your name </label><br>
        <input type="text" id="name" placeholder="first name">
        <input type="text" id="name" placeholder="last name">
        <label for="email"> Email</label><br>
        <input type="email" id="email" placeholder="Your email">
        <label for="number"> Number</label>
        <input type="text" id="number" placeholder="Your number">
        <label for="message"> message</label>
        <textarea name="message" id="message" placeholder="Please enter your comment" rows="5"></textarea>
        <button class="button">Submit</button>


    </div>
</body>

</html>
