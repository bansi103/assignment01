<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
            font-family: sans-serif;
            background-color: #f9f9f9;
        }

        .gallery {
            display: grid;
            grid-template-columns: auto auto auto;
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .image-container {
            height: 200px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .image-container img:hover {
            transform: scale(1.20);
        }

        @media(max-width:600px) {
            .gallery {
                grid-template-columns: auto;
            }

        }
    </style>
</head>

<body>
    <div class="gallery">
        <div class="image-container">
            <img src="../photo/7_lion.jpg" alt="lion">
        </div>
        <div class="image-container">
            <img src="../photo/6_images.jpg" alt="img">
        </div>
        <div class="image-container">
            <img src="../photo/4_Panda.jpg" alt="img">
        </div>
        <div class="image-container">
            <img src="../photo/7_lion.jpg" alt="lion">
        </div>
        <div class="image-container">
            <img src="../photo/6_images.jpg" alt="img">
        </div>
        <div class="image-container">
            <img src="../photo/4_Panda.jpg" alt="img">
        </div>
    </div>
</body>

</html>
