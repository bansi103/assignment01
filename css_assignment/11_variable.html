<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: skyblue;
            --secondary-color: orange;
            --text-color: white;
        }

        header {
            height: 100px;
            background-color: var(--primary-color);
            text-align: center;
            padding: 20px;
            color: var(--text-color);
        }

        main {
            height: 300px;
            background-color: var(--secondary-color);
            padding: 20px;
            color: var(--text-color);


        }

        h2 {
            margin-bottom: 20px;
        }

        footer {
            height: 50px;
            background-color: var(--primary-color);

            color: var(--text-color);
            padding: 15px;
            text-align: center;
        }
    </style>
</head>

<body>
    <header>
        <h1>Welcome to My Web Page</h1>
    </header>

    <main>
        <h2>Main Content</h2>
        <p>This is a simple web page that uses CSS variables to control the color theme. Try changing the CSS variables
            to see the theme update.</p>
        <p>Click <a href="#">here</a> to explore more.</p>
    </main>

    <footer>
        <p>contact number :- +91 0000000000</p>
    </footer>
</body>

</html>
